name: skeleton-ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: lint
        run: npm run lint
      - name: unit-test
        run: npm test
      - name: build
        run: npm run build
